<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal - MiNa</title>
  <link rel="stylesheet" href="/static/css/ServicioCliente.css" />
  <link rel="stylesheet" href="/static/css/Servicio.css" />
</head>

<body>
  <div class="side-bar">
    <div class="top-contact-info">
      <div>
        <img
          src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128"
          alt="email" />
        <h6>mina.imn@csic.es</h6>
      </div>
      <div>
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png"
          alt="phone" />
        <h6>+34 91 806 07 00</h6>
      </div>
    </div>

    <div id="profileContainer">
      <span id="userNameBar"></span>
      <img id="userIcon"
        src="https://static.vecteezy.com/system/resources/thumbnails/021/353/308/small/user-icon-for-website-and-mobile-apps-png.png"
        alt="userIcon" style="cursor: pointer; width: 40px; height: 40px; border-radius: 50%" />
      <div id="dropdownMenu" class="hidden">
        <button class="menu-option" id="editProfile">Edit Profile</button>
        <button class="menu-option" id="logOut">Log Out</button>
      </div>
    </div>
  </div>



  <div id="mainContainer">


    <div class="tabs-container" style="width: 100%">
      <button class="tab-btn active" onclick="openTab(event, 'tabGenerar')">
        Create Offer
      </button>
      <button class="tab-btn" onclick="openTab(event, 'tabMisOfertas')">
        My Offers
      </button>
      <button class="tab-btn" onclick="openTab(event, 'tabFacturacion')">
        Billing
      </button>
    </div>

    <div id="tabGenerar" class="tab-content active" style="width: 100%">
      <div id="servicesGrid"></div>
      <button id="btnSendRequest" style="
            margin-top: 20px;
            background-color: var(--color-csic);
            color: white;
            padding: 12px 24px;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
          ">
        Create Selected Offer
      </button>
    </div>

    <div id="tabMisOfertas" class="tab-content" style="width: 100%">
      <div id="requestList"></div>
    </div>

    <div id="tabFacturacion" class="tab-content" style="width: 100%;">
      <div id="invoiceList" style="display:flex; flex-direction:column; gap:20px; padding:20px 0;">
        <p>Loading invoices...</p>
      </div>
    </div>
  </div>

  <div id="icon">
    <img src="/static/imagenes/Csic.png" alt="Csic Logo" class="centered-icon" />
    <div id="icon2">
      <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
    </div>
    <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon" />
    <div class="social-links">
      <a href="https://es-es.facebook.com/CSIC/" class="btn-social"><img
          src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png" alt="Facebook"></a>
      <a href="https://www.instagram.com/csic/" class="btn-social" id="insta"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/018/930/691/small/instagram-logo-instagram-icon-transparent-free-png.png"
          alt="Instagram"></a>
      <a href="https://x.com/csic" class="btn-social" id="twitter"><img
          src="https://www.freepnglogos.com/elon-musk-twitter-rebrand-x-logo-2.png"></a>
      <a href="https://www.youtube.com/user/csicdptocomunicacion" class="btn-social" id="youtube"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/042/148/649/small/youtube-logo-youtube-social-media-icon-free-png.png"
          alt="Youtube"></a>
      <a href="https://www.tiktok.com/@elcsic" class="btn-social" id="tiktok"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/065/386/723/small/tiktok-white-icon-logo-tiktok-app-transparent-background-premium-social-media-design-for-digital-download-free-png.png"
          alt="TikTok"></a>
      <a href="https://bsky.app/profile/csic.es" class="btn-social" id="bsky"><img
          src="https://images.seeklogo.com/logo-png/52/2/bluesky-logo-png_seeklogo-520643.png" alt="Bsky"></a>
    </div>
  </div>

  <div class="side-bar" id="footer" style="display:flex; justify-content:center; align-items:center; gap:30px; font-size:14px; padding:0 20px;">
    <div style="display:flex; gap:10px; font-weight:bold; align-items:center;">
      <span style="cursor:pointer; color:#0f172a; padding:4px 8px;" onclick="changeLanguage('en')">English</span>
      <span style="color:#64748b;">|</span>
      <span style="cursor:pointer; color:#0f172a; padding:4px 8px;" onclick="changeLanguage('es')">Español</span>
    </div>
    <div style="width:2px; height:20px; background-color:#cbd5e1;"></div>
    <div style="display:flex; gap:20px; font-weight:600; align-items:center;">
      <a href="/contacto" style="color:#0f172a; text-decoration:none;">Contact</a>
      <a href="/aviso-legal" style="color:#0f172a; text-decoration:none;">Legal Notice</a>
      <a href="/cookies" style="color:#0f172a; text-decoration:none;">Cookies Policy</a>
      <a href="/proteccion-datos" style="color:#0f172a; text-decoration:none;">Data Protection Policy</a>
      <span style="color:#cbd5e1;">|</span>
      <a href="/login" style="color:#0f172a; text-decoration:none;">Log In</a>
      <a href="/registro" style="color:#0f172a; text-decoration:none;">Sign Up</a>
    </div>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,es', autoDisplay: false}, 'google_translate_element');
      }
      function changeLanguage(langCode) {
        if (langCode === 'en') {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
        } else {
            document.cookie = "googtrans=/en/" + langCode + "; expires=Thu, 01 Jan 2030 00:00:00 UTC; path=/;";
            document.cookie = "googtrans=/en/" + langCode + "; expires=Thu, 01 Jan 2030 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
        }
        location.reload();
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      iframe.goog-te-banner-frame { display: none !important; }
      body { position: static !important; top: 0px !important; }
      html { position: static !important; top: 0px !important; }
      #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; border: none !important; }
    </style>
  </div>

  <script src="/static/js/ServicioCliente.js" defer></script>
</body>

</html>
