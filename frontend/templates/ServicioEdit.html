<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - IMN</title>
    <link rel="stylesheet" href="/static/css/Servicio.css">
    <link rel="stylesheet" href="/static/css/ServicioEdit.css">
  <link rel="stylesheet" href="/static/css/Footer.css">
  <link rel="stylesheet" href="/static/css/Toast.css">
</head>
<body>
    <div class="side-bar" id="topBar">
        <div class="top-contact-info">
            <div>
                <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128" alt="email">
                <h6>mina.imn@csic.es</h6>
            </div>
            <div>
                <img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="phone">
                <h6>+34 91 806 07 00</h6>
            </div>
        </div>

        <!-- Perfil con Dropdown (Igual que en Cliente) -->
        <div id="profileContainer">
            <span id="userNameBar"></span>
            <img id="userIcon" src="https://static.vecteezy.com/system/resources/thumbnails/021/353/308/small/user-icon-for-website-and-mobile-apps-png.png" alt="userIcon">
            <div id="dropdownMenu" class="hidden">
                <button class="menu-option" id="goToServices">Services</button>
                <button class="menu-option" id="logOut">Log Out</button>
            </div>
        </div>
    </div>

    
    <div id="mainContainer">
        <h2 class="section-title">Account Settings</h2>
        
        <div id="editForm">
            <div class="photo-section">
                <img id="photoPreview" src="https://static.vecteezy.com/system/resources/thumbnails/021/353/308/small/user-icon-for-website-and-mobile-apps-png.png" alt="Preview">
                <input type="file" id="inputPhotoFile" accept="image/*" style="display: none;">
                <div class="photo-buttons">
                    <button type="button" id="btnChangePhoto" class="btn-secundario">Change Photo</button>
                    <button type="button" id="btnRemovePhoto" class="btn-danger">Remove Photo</button>
                </div>
            </div>

            <div class="fields-grid">
                <div class="input-group">
                    <label>Username:</label>
                    <input type="text" id="editNickname" placeholder="Your nickname">
                </div>

                <div class="input-group">
                    <label>Entity / Origin:</label>
                    <select id="editEntity">
                        <option value="interno(MiNa)">Internal (MiNa)</option>
                        <option value="CSIC">CSIC</option>
                        <option value="UAM">UAM</option>
                        <option value="Universidad">University</option>
                        <option value="OPIS">OPIS</option>
                        <option value="Empresa">Company</option>
                    </select>
                </div>
            </div>

            <div id="internalFields" class="hidden-form">
                <div class="fields-grid">
                    <div class="input-group">
                        <label>Research Group:</label>
                        <select id="editGroup">
                            <option value="" disabled selected>Select a group</option>
                            <option value="FINGER">FINGER</option>
                            <option value="BIOMECHANICS">BIOMECHANICS</option>
                            <option value="ES4TERM">ES4TERM</option>
                            <option value="OMS">OMS</option>
                            <option value="MBE">MBE</option>
                            <option value="METALNANO">METALNANO</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>IP Address:</label>
                        <input type="text" id="editIP">
                    </div>
                    <div class="input-group">
                        <label>Internal Account:</label>
                        <input type="text" id="editInternalAccount">
                    </div>
                    <div class="input-group">
                        <label>Project Code:</label>
                        <input type="text" id="editProject">
                    </div>
                </div>
            </div>

            <button id="btnSaveChanges">Save Changes</button>
        </div>
    </div>

    <div id="icon">
        <img src="/static/imagenes/Csic.png" alt="Csic Logo" class="centered-icon">
        <div id="icon2"><img src="/static/imagenes/Mina.png" alt="Mina"></div>
        <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon">
        <div class="social-links">
            <a href="https://es-es.facebook.com/CSIC/" class="btn-social"><img src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png" alt="Facebook"></a>
            <a href="https://www.instagram.com/csic/" class="btn-social" id="insta"><img src="https://static.vecteezy.com/system/resources/thumbnails/018/930/691/small/instagram-logo-instagram-icon-transparent-free-png.png" alt="Instagram"></a>
            <a href="https://x.com/csic" class="btn-social" id="twitter"><img src="https://www.freepnglogos.com/elon-musk-twitter-rebrand-x-logo-2.png"></a>
            <a href="https://www.youtube.com/user/csicdptocomunicacion" class="btn-social" id="youtube"><img src="https://static.vecteezy.com/system/resources/thumbnails/042/148/649/small/youtube-logo-youtube-social-media-icon-free-png.png" alt="Youtube"></a>
            <a href="https://www.tiktok.com/@elcsic" class="btn-social" id="tiktok"><img src="https://static.vecteezy.com/system/resources/thumbnails/065/386/723/small/tiktok-white-icon-logo-tiktok-app-transparent-background-premium-social-media-design-for-digital-download-free-png.png" alt="TikTok"></a>
            <a href="https://bsky.app/profile/csic.es" class="btn-social" id="bsky"><img src="https://images.seeklogo.com/logo-png/52/2/bluesky-logo-png_seeklogo-520643.png" alt="Bsky"></a>
        </div>
    </div>

    <div class="side-bar" id="footer" style="display:flex; justify-content:center; align-items:center; gap:30px; font-size:14px; padding:0 20px;">
      <div style="display:flex; gap:10px; font-weight:bold; align-items:center;">
        <span style="cursor:pointer; color:#0f172a; padding:4px 8px;" onclick="changeLanguage('en')">English</span>
        <span style="color:#64748b;">|</span>
        <span style="cursor:pointer; color:#0f172a; padding:4px 8px;" onclick="changeLanguage('es')">Español</span>
      </div>
      <div style="width:2px; height:20px; background-color:#cbd5e1;"></div>
      <div style="display:flex; gap:20px; font-weight:600; align-items:center;">
        <a href="/contacto" style="color:#0f172a; text-decoration:none;">Contact</a>
        <a href="/aviso-legal" style="color:#0f172a; text-decoration:none;">Legal Notice</a>
        <a href="/cookies" style="color:#0f172a; text-decoration:none;">Cookies Policy</a>
        <a href="/proteccion-datos" style="color:#0f172a; text-decoration:none;">Data Protection Policy</a>
        <span style="color:#cbd5e1;">|</span>
        <a href="/login" style="color:#0f172a; text-decoration:none;">Log In</a>
        <a href="/registro" style="color:#0f172a; text-decoration:none;">Sign Up</a>
        <span style="color:#cbd5e1;">|</span>
        <a href="/developers" style="color:#0f172a; text-decoration:none;">Developers</a>
      </div>
      <div id="google_translate_element" style="display:none;"></div>
      
      <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
      
    </div>

    <script src="/static/js/Toast.js"></script>
    <script src="/static/js/ServicioEdit.js" defer></script>
  <script src="/static/js/Footer.js"></script>
</body>
</html>
