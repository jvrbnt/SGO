<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Portal - IMN</title>
  <link rel="stylesheet" href="/static/css/ServicioTecnico.css" />
  <link rel="stylesheet" href="/static/css/Servicio.css" />
</head>

<body>
  <div class="side-bar">
    <div class="top-contact-info">
      <div>
        <img
          src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128"
          alt="email" />
        <h6>mina.imn@csic.es</h6>
      </div>
      <div>
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png"
          alt="phone" />
        <h6>+34 91 806 07 00</h6>
      </div>
    </div>

    <!-- Contenedor de perfil actualizado -->
    <div id="profileContainer">
      <span id="userNameBar"></span>
      <img id="userIcon"
        src="https://static.vecteezy.com/system/resources/thumbnails/021/353/308/small/user-icon-for-website-and-mobile-apps-png.png"
        alt="userIcon" />
      <div id="dropdownMenu" class="hidden">
        <button class="menu-option" id="editProfile">Edit Profile</button>
        <button class="menu-option" id="logOut">Log Out</button>
      </div>
    </div>
  </div>



  <div id="mainContainer">

    <div class="tabs-container" style="width: 100%;">
      <button class="tab-btn active" onclick="openTab(event, 'tabGlobales')">
        Global Offers
      </button>
      <button class="tab-btn" onclick="openTab(event, 'tabMisOfertas')">
        My Offers
      </button>
      <button class="tab-btn" onclick="openTab(event, 'tabFacturacion')">
        Billing
      </button>
      <button class="tab-btn" onclick="openTab(event, 'tabPrecios')">
        Prices
      </button>
    </div>

    <div id="tabGlobales" class="tab-content active" style="width: 100%;">
      <h2 class="section-title" style="text-align: center">
        Global Offers
      </h2>
      <div class="status-filter-buttons" id="globalFilters">
        <button class="filter-btn global-btn active" data-status="all"
          onclick="setFilter('global', 'all', this)">All</button>
        <button class="filter-btn global-btn" data-status="requested"
          onclick="setFilter('global', 'requested', this)">Requested</button>
        <button class="filter-btn global-btn" data-status="quoted"
          onclick="setFilter('global', 'quoted', this)">Quoted</button>
        <button class="filter-btn global-btn" data-status="accepted"
          onclick="setFilter('global', 'accepted', this)">Accepted</button>
        <button class="filter-btn global-btn" data-status="finished"
          onclick="setFilter('global', 'finished', this)">Finished</button>
      </div>
      <div id="globalRequestList">
        <p style="text-align: center; padding: 20px">
          Loading offers from database...
        </p>
      </div>
    </div>

    <div id="tabMisOfertas" class="tab-content" style="width: 100%;">
      <h2 class="section-title" style="text-align: center">
        My Offers
      </h2>
      <div class="status-filter-buttons" id="myFilters">
        <button class="filter-btn my-btn active" data-status="all" onclick="setFilter('my', 'all', this)">All</button>
        <button class="filter-btn my-btn" data-status="requested"
          onclick="setFilter('my', 'requested', this)">Requested</button>
        <button class="filter-btn my-btn" data-status="quoted" onclick="setFilter('my', 'quoted', this)">Quoted</button>
        <button class="filter-btn my-btn" data-status="accepted"
          onclick="setFilter('my', 'accepted', this)">Accepted</button>
        <button class="filter-btn my-btn" data-status="finished"
          onclick="setFilter('my', 'finished', this)">Finished</button>
      </div>
      <div id="myOffersList">
        <p style="text-align: center; padding: 20px">
          Loading your assigned offers...
        </p>
      </div>
    </div>

    <div id="tabFacturacion" class="tab-content" style="width: 100%; padding: 20px">
      <h2 class="section-title">Billing Module</h2>
      <p>Under development.</p>
    </div>

    <div id="tabPrecios" class="tab-content" style="width: 100%;">
      <h2 class="section-title" style="text-align: center">Service Prices</h2>
      <div id="pricesTableContainer"
        style="overflow-x: auto; background: #fff; border-radius: 8px; border: 1px solid #ccc; padding: 20px;">
        <p style="text-align: center; color: #666;">Loading prices...</p>
      </div>
    </div>
  </div>

  <!-- Price Edit Modal -->
  <div id="priceEditModal" class="modal-backdrop" style="display:none; opacity:1;">
    <div style="background:white; width:320px; border-radius:12px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.25); animation:modalIn 0.25s ease-out;">
      <!-- Header -->
      <div style="background:var(--color-csic); color:white; padding:10px 18px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:700; font-size:14px; font-family:'Montserrat',sans-serif;">Edit Price</span>
        <button onclick="window.closePriceModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer; line-height:1;">&times;</button>
      </div>
      <!-- Body -->
      <div style="padding:14px 20px 10px;">
        <p id="priceEditContext" style="margin:0 0 10px 0; font-size:13px; font-weight:500; color:#475569; line-height:1.35; font-family:'Montserrat',sans-serif;"></p>
        <label for="newPriceInput" style="display:block; margin-bottom:4px; font-size:10px; font-weight:700; color:#94a3b8; letter-spacing:0.8px; font-family:'Montserrat',sans-serif;">NEW HOURLY PRICE (€/h)</label>
        <input type="number" id="newPriceInput" step="0.01" min="0"
          style="display:block; width:100%; box-sizing:border-box; padding:8px 12px; border:2px solid #e2e8f0; border-radius:6px; font-size:16px; font-weight:700; color:#1e293b; outline:none; transition:border-color 0.2s; text-align:center; font-family:'Montserrat',sans-serif;"
          onfocus="this.style.borderColor='var(--color-csic)'" onblur="this.style.borderColor='#e2e8f0'">
      </div>
      <!-- Footer -->
      <div style="padding:8px 20px 16px; display:flex; gap:8px;">
        <button onclick="window.savePriceUpdate()" class="btn-card" style="flex:2; background:#10b981; color:white; padding:9px 0; margin:0; font-size:12px;">SAVE CHANGES</button>
        <button onclick="window.closePriceModal()" class="btn-card" style="flex:1; background:#ef4444; color:white; padding:9px 0; margin:0; font-size:12px;">CANCEL</button>
      </div>
    </div>
  </div>

  <div id="icon">
    <img src="/static/imagenes/Csic.png" alt="Csic Logo" class="centered-icon" />
    <div id="icon2">
      <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
    </div>
    <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon" />
    <div class="social-links">
      <a href="https://es-es.facebook.com/CSIC/" class="btn-social"><img
          src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png" alt="Facebook"></a>
      <a href="https://www.instagram.com/csic/" class="btn-social" id="insta"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/018/930/691/small/instagram-logo-instagram-icon-transparent-free-png.png"
          alt="Instagram"></a>
      <a href="https://x.com/csic" class="btn-social" id="twitter"><img
          src="https://www.freepnglogos.com/elon-musk-twitter-rebrand-x-logo-2.png"></a>
      <a href="https://www.youtube.com/user/csicdptocomunicacion" class="btn-social" id="youtube"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/042/148/649/small/youtube-logo-youtube-social-media-icon-free-png.png"
          alt="Youtube"></a>
      <a href="https://www.tiktok.com/@elcsic" class="btn-social" id="tiktok"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/065/386/723/small/tiktok-white-icon-logo-tiktok-app-transparent-background-premium-social-media-design-for-digital-download-free-png.png"
          alt="TikTok"></a>
      <a href="https://bsky.app/profile/csic.es" class="btn-social" id="bsky"><img
          src="https://images.seeklogo.com/logo-png/52/2/bluesky-logo-png_seeklogo-520643.png" alt="Bsky"></a>
    </div>
  </div>

  <div class="side-bar" id="footer"></div>

  <script src="/static/js/ServicioTecnico.js" defer></script>
</body>

</html>
