<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password reset - MiNa</title>
  <link rel="stylesheet" href="/static/css/ServicioLogin.css" />
  <link rel="stylesheet" href="/static/css/Servicio.css" />
</head>
<body>
  <div class="form-wrapper">
    <div id="login">
      <form id="resetForm">
        <h2>Password reset</h2>
        <div class="field" id="emailField">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
        </div>
        <button type="submit" id="requestButton">Send reset link</button>
        <div class="field" id="passwordFields" hidden>
          <label for="newPassword">New password:</label>
          <input type="password" id="newPassword" minlength="8" />
          <label for="confirmPassword">Confirm password:</label>
          <input type="password" id="confirmPassword" minlength="8" />
          <button type="button" id="confirmButton">Change password</button>
        </div>
        <p id="message" role="status"></p>
        <a href="/login">Back to login</a>
      </form>
    </div>
  </div>
  <script src="/static/js/ResetPassword.js" defer></script>
</body>
</html>
