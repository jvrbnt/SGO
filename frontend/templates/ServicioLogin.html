<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - IMN</title>
  <link rel="stylesheet" href="/static/css/ServicioLogin.css" />
  <link rel="stylesheet" href="/static/css/Servicio.css" />
</head>

<body>
  <div class="side-bar">
    <div class="top-contact-info">
      <div>
        <img
          src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128"
          alt="email" />
        <h6>mina.imn@csic.es</h6>
      </div>
      <div>
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png"
          alt="phone" />
        <h6>+34 91 806 07 00</h6>
      </div>
    </div>
  </div>

  <div id="imgCentral">
    <h1>MiNa Services Management</h1>
  </div>

  <div class="form-wrapper">
    <div id="icon2">
      <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
    </div>

    <div id="login">
      <form id="loginForm">
        <h2 id="title">Log in</h2>
        <div class="field">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="field">
          <label for="password">Password:</label>
          <div class="password-container">
            <input type="password" id="password" placeholder="Password" required />
            <span class="eye-toggle" id="togglePassword">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
              </svg>
            </span>
          </div>
        </div>
        <button type="submit">Log in</button>

        <a href="/registro">Sign up</a>
      </form>
    </div>
  </div>

  <div id="icon">
    <img src="/static/imagenes/Csic.png" alt="Csic Logo Left" class="centered-icon icon-left" />
    <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon icon-right" />
    <div class="social-links">
      <a href="https://es-es.facebook.com/CSIC/" class="btn-social"><img
          src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png" alt="Facebook"></a>
      <a href="https://www.instagram.com/csic/" class="btn-social" id="insta"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/018/930/691/small/instagram-logo-instagram-icon-transparent-free-png.png"
          alt="Instagram"></a>
      <a href="https://x.com/csic" class="btn-social" id="twitter"><img
          src="https://www.freepnglogos.com/elon-musk-twitter-rebrand-x-logo-2.png"></a>
      <a href="https://www.youtube.com/user/csicdptocomunicacion" class="btn-social" id="youtube"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/042/148/649/small/youtube-logo-youtube-social-media-icon-free-png.png"
          alt="Youtube"></a>
      <a href="https://www.tiktok.com/@elcsic" class="btn-social" id="tiktok"><img
          src="https://static.vecteezy.com/system/resources/thumbnails/065/386/723/small/tiktok-white-icon-logo-tiktok-app-transparent-background-premium-social-media-design-for-digital-download-free-png.png"
          alt="TikTok"></a>
      <a href="https://bsky.app/profile/csic.es" class="btn-social" id="bsky"><img
          src="https://images.seeklogo.com/logo-png/52/2/bluesky-logo-png_seeklogo-520643.png" alt="Bsky"></a>
    </div>
  </div>

  <div class="side-bar" id="footer"></div>

  <script src="/static/js/ServicioLogin.js" defer></script>
</body>

</html>
