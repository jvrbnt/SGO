<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginServicio</title>
    <link rel="stylesheet" href="ServicioLogin.css">
    <link rel="stylesheet" href="Servicio.css">
</head>
<body>
    <div class ="barrasLaterales">
    </div>
    <div id = "icon"><img src = "imagenes/Csic.png"></div>
    <div id = "imgCentral"><h1>Gestión de Peticiones</h1></div>
   <div id="login">
    <form id="loginForm">
        <h2>Login up</h2>
        <div class="campo">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="campo">
            <label for="password">Password:</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Password" required>
                <img src="https://images.icon-icons.com/3252/PNG/96/eye_show_regular_icon_205294.png" id="togglePassword" class="eye-icon" alt="Mostrar contraseña">
            </div>
        </div>

        <button type="submit">Login up</button>
        <a href="ServicioSign.html">Sign up</a>
    </form>
</div>
<div id = "icon2"><img src = "imagenes/Mina.png"></div>
<div class="barrasLaterales"></div>
</body>
<script src="ServicioLogin.js" defer></script>
</html>
