<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - IMN</title>
    <link rel="stylesheet" href="ServicioEdit.css">
    <link rel="stylesheet" href="Servicio.css">
</head>
<body>
    <div class="barrasLaterales" id="barraSup">
        <div id="perfilContainer">
            <span id="nombreUsuarioBarra"></span>
            <img id="iconoUsuario" src="" alt="iconoUsuario">
            <div id="menuDesplegable" class="oculto">
                <button class="opcionMenu" id="irServicios">Servicios</button>
                <button class="opcionMenu" id="cerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div id="icon"><img src="imagenes/Csic.png"></div>
    
    <div id="contenedorPrincipal">
        <h2 class="titulo-seccion">Configuración de la Cuenta</h2>
        
        <div id="formularioEdicion">
            <div class="seccion-foto">
                <img id="previewFoto" src="" alt="Vista previa">
                <input type="file" id="inputFileFoto" accept="image/*" style="display: none;">
                <div class="botones-foto">
                    <button type="button" id="btnCambiarFoto" class="btn-secundario">Cambiar Foto</button>
                    <button type="button" id="btnQuitarFoto" class="btn-peligro">Quitar Foto</button>
                </div>
            </div>

            <div class="grid-campos">
                <div class="input-group">
                    <label>Apodo de Usuario:</label>
                    <input type="text" id="editApodo" placeholder="Tu apodo">
                </div>

                <div class="input-group">
                    <label>Entidad / Procedencia:</label>
                    <select id="editEntidad">
                        <option value="interno(MiNa)">interno(MiNa)</option>
                        <option value="CSIC">CSIC</option>
                        <option value="UAM">UAM</option>
                        <option value="Universidad">Universidad</option>
                        <option value="OPIS">OPIS</option>
                        <option value="Empresa">Empresa</option>
                    </select>
                </div>
            </div>

            <div id="camposInternos" class="oculto-form">
                <div class="grid-campos">
                    <div class="input-group">
                        <label>Grupo de Investigación:</label>
                        <select id="editGrupo">
                            <option value="" disabled selected>Selecciona un grupo</option>
                            <option value="FINGER">FINGER</option>
                            <option value="BIOMECÁNICA">BIOMECÁNICA</option>
                            <option value="ES4TERM">ES4TERM</option>
                            <option value="OMS">OMS</option>
                            <option value="MBE">MBE</option>
                            <option value="METALNANO">METALNANO</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Dirección IP:</label>
                        <input type="text" id="editIP">
                    </div>
                    <div class="input-group">
                        <label>Cuenta Interna:</label>
                        <input type="text" id="editCuentaInterna">
                    </div>
                    <div class="input-group">
                        <label>Código Proyecto:</label>
                        <input type="text" id="editProyecto">
                    </div>
                </div>
            </div>

            <button id="btnGuardarCambios">Guardar Cambios</button>
        </div>
    </div>

    <div id="icon2"><img src="imagenes/Mina.png"></div>

    <div class="barrasLaterales" id="datos">
        <div>
            <img src="https://symbl-cdn.com/i/webp/bf/f742f23d736ec34c4cbe8d7e825e10.webp" alt="correo">
            <h6>Gmail: mina.imn@csic.es</h6>
        </div>
        <div>
            <img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="telefono">
            <h6>Teléfono: +34 91 806 07 00</h6>
        </div>
    </div>

    <script src="ServicioEdit.js" defer></script>
</body>
</html>
