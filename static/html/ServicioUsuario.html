<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Cliente - MiNa</title>
    <link rel="stylesheet" href="/static/css/ServicioUsuario.css" />
    <link rel="stylesheet" href="/static/css/Servicio.css" />
  </head>
  <body>
    <div class="side-bar">
      <div class="top-contact-info">
        <div>
          <img
            src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128"
            alt="email"
          />
          <h6>mina.imn@csic.es</h6>
        </div>
        <div>
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png"
            alt="phone"
          />
          <h6>+34 91 806 07 00</h6>
        </div>
      </div>
      <div
        id="profileContainer"
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          margin-right: 20px;
        "
      >
        <span id="userNameBar" style="color: white; font-weight: bold"></span>
        <button
          id="logOut"
          style="
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
          "
        >
          Salir
        </button>
      </div>
    </div>

    <div id="imgCentral"><h1>MiNa Services Management</h1></div>

    <div id="mainContainer">
      <div id="icon2" style="text-align: center; margin-bottom: 20px">
        <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
      </div>

      <div class="tabs-container" style="width: 100%">
        <button class="tab-btn active" onclick="openTab(event, 'tabGenerar')">
          Generar Oferta
        </button>
        <button class="tab-btn" onclick="openTab(event, 'tabMisOfertas')">
          Mis Ofertas
        </button>
        <button class="tab-btn" onclick="openTab(event, 'tabFacturacion')">
          Facturación
        </button>
      </div>

      <div id="tabGenerar" class="tab-content active" style="width: 100%">
        <h2 class="section-title">Catálogo de Servicios</h2>
        <div id="servicesGrid"></div>
        <button
          id="btnSendRequest"
          style="
            margin-top: 20px;
            background-color: var(--color-csic);
            color: white;
            padding: 12px 24px;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
          "
        >
          Generar Oferta Seleccionada
        </button>
      </div>

      <div id="tabMisOfertas" class="tab-content" style="width: 100%">
        <h2 class="section-title">Historial de Ofertas</h2>
        <div id="requestList"></div>
      </div>

      <div
        id="tabFacturacion"
        class="tab-content"
        style="width: 100%; padding: 20px"
      >
        <h2 class="section-title">Módulo de Facturación</h2>
        <p>En desarrollo.</p>
      </div>
    </div>

    <div id="icon">
      <img
        src="/static/imagenes/Csic.png"
        alt="Csic Logo Left"
        class="centered-icon icon-left"
      />
      <img
        src="/static/imagenes/MicroNano.png"
        alt="MicroNano Logo"
        class="centered-icon icon-right"
      />
    </div>

    <div class="side-bar" id="footer">
      <img
        src="/static/imagenes/CsicGris.png"
        alt="Footer Logo"
        class="logo-footer"
      />
    </div>

    <script src="/static/js/ServicioUsuario.js" defer></script>
  </body>
</html>
