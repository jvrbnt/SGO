<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Panel - IMN</title>
    <link rel="stylesheet" href="/static/css/ServicioUsuario.css">
    <link rel="stylesheet" href="/static/css/Servicio.css">
</head>
<body>
    <div class="side-bar">
        <div class="top-contact-info">
            <div>
                <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128" alt="email">
                <h6>mina.imn@csic.es</h6>
            </div>
            <div>
                <img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="phone">
                <h6>+34 91 806 07 00</h6>
            </div>
        </div>
        <div id="profileContainer" style="display: flex; align-items: center; gap: 10px; margin-right: 20px;">
            <span id="userNameBar" style="color: white; font-weight: bold;"></span> 
            <button id="logOut" style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px;">Exit</button>
        </div>
    </div>

    <div id="imgCentral"><h1>MiNa Services Management</h1></div>

    <div id="mainContainer">
        <div id="icon2" style="text-align: center; margin-bottom: 30px;">
            <img src="/static/imagenes/Mina.png" alt="Mina Logo">
        </div>

        <div id="services">
            <h2 class="section-title">Generar Nueva Solicitud</h2>
            <div id="servicesGrid">
                <p style="padding: 20px;">Cargando catálogo desde PostgreSQL...</p>
            </div>
            <button id="btnSendRequest" style="margin-top: 20px; background-color: var(--color-csic); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Enviar Solicitud</button>
        </div>

        <div id="requests" style="margin-top: 50px;">
            <h2 class="section-title">Mis Solicitudes</h2>
            <div id="requestList"></div>
        </div>
    </div>

    <div id="icon">
        <img src="/static/imagenes/Csic.png" alt="Csic Logo Left" class="centered-icon icon-left">
        <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon icon-right">
    </div>

    <div class="side-bar" id="footer">
        <img src="/static/imagenes/CsicGris.png" alt="Footer Logo" class="logo-footer">
    </div>

    <script src="/static/js/ServicioUsuario.js" defer></script>
</body>
</html>
