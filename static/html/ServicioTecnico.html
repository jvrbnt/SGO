<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Portal - MiNa SGO</title>
    <link rel="stylesheet" href="/static/css/ServicioTecnico.css">
</head>
<body>
    <div class="side-bar" id="topBar">
        <div class="top-contact-info">
            <div>
                <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128" alt="email">
                <h6>mina.imn@csic.es</h6>
            </div>
            <div>
                <img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="phone">
                <h6>+34 91 806 07 00</h6>
            </div>
        </div>

        <div id="profileContainer">
            <span id="techName">Loading Technical Staff...</span> 
            <img id="techProfilePic" src="https://static.vecteezy.com/system/resources/thumbnails/021/353/308/small/user-icon-for-website-and-mobile-apps-png.png" alt="techIcon">
        </div>
    </div>

    <div id="icon">
        <img src="/static/imagenes/Csic.png" alt="Csic Logo Left" class="centered-icon icon-left">
        <img src="/static/imagenes/MicroNano.png" alt="Csic Logo Right" class="centered-icon icon-right">
    </div>

    <main class="main-content">
        <div class="dashboard-header">
            <h1>Global Service Requests</h1>
            <p>Technical management of incoming offers and service status.</p>
        </div>

        <div id="globalRequestList" class="request-grid">
            <p>Connecting to database...</p>
        </div>
    </main>

    <div id="icon2"><img src="/static/imagenes/Mina.png"></div>

    <div class="side-bar" id="footer">
        <img src="/static/imagenes/CsicGris.png" alt="Footer Logo" class="logo-footer">
        <div class="footer-info">
            <small>Internal Management System - MiNa SGO</small>
        </div>
    </div>

    <script src="/static/js/ServicioTecnico.js"></script>
</body>
</html>
