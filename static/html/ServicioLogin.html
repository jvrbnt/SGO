<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - IMN</title>
    <link rel="stylesheet" href="/static/css/ServicioLogin.css" />
    <link rel="stylesheet" href="/static/css/Servicio.css" />
  </head>
  <body>
    <div class="side-bar">
      <div class="top-contact-info">
        <div>
          <img
            src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128"
            alt="email"
          />
          <h6>mina.imn@csic.es</h6>
        </div>
        <div>
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png"
            alt="phone"
          />
          <h6>+34 91 806 07 00</h6>
        </div>
      </div>
    </div>

    <div id="imgCentral"><h1>MiNa Services Management</h1></div>

    <div class="form-wrapper">
      <div id="icon2">
        <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
      </div>

      <div id="login">
        <form id="loginForm">
          <h2 id="title">Log in</h2>
          <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Email" required />
          </div>
          <div class="field">
            <label for="password">Password:</label>
            <div class="password-container">
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
            </div>
          </div>
          <button type="submit">Log in</button>

          <a href="/static/html/ServicioSign.html">Sign up</a>
        </form>
      </div>
    </div>

    <div id="icon">
      <img
        src="/static/imagenes/Csic.png"
        alt="Csic Logo Left"
        class="centered-icon icon-left"
      />
      <img
        src="/static/imagenes/MicroNano.png"
        alt="MicroNano Logo"
        class="centered-icon icon-right"
      />
    </div>

    <div class="side-bar" id="footer">
      <img
        src="/static/imagenes/CsicGris.png"
        alt="Footer Logo"
        class="logo-footer"
      />
      <div class="social-links">
        <a href="https://es-es.facebook.com/CSIC/" class="btn-social"
          ><img
            src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png"
            alt="Facebook"
        /></a>
      </div>
    </div>

    <script src="/static/js/ServicioLogin.js" defer></script>
  </body>
</html>
