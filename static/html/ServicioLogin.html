<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MiNa SGO</title>
    <link rel="stylesheet" href="/static/css/Servicio.css" />
    <link rel="stylesheet" href="/static/css/ServicioLogin.css" />
</head>
<body>
    <div id="icon">
        <img src="/static/imagenes/Csic.png" alt="Csic Logo" class="centered-icon icon-left" />
        <img src="/static/imagenes/MicroNano.png" alt="MicroNano Logo" class="centered-icon icon-right" />
    </div>

    <div class="form-wrapper">
        <div id="login">
            <h2 id="title">Client Login</h2>

            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required />
                <input type="password" id="password" placeholder="Password" required />
                <button type="submit">Log In</button>
            </form>

            <div style="margin-top: 15px;">
                <button type="button" id="techModeBtn" style="background-color: #555;">Staff Access</button>
            </div>

            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Don't have an account? 
                <a href="/static/html/ServicioSign.html">Sign Up</a>
            </p>
        </div>
    </div>

    <div id="icon2">
        <img src="/static/imagenes/Mina.png" alt="Mina Logo" />
    </div>

    <script src="/static/js/ServicioLogin.js"></script>
</body>
</html>
