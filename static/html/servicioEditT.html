<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil Técnico - IMN</title>
    <link rel="stylesheet" href="/SGO/static/css/ServicioEdit.css">
    <link rel="stylesheet" href="/SGO/static/css/Servicio.css">
</head>
<body>
    <div class="barrasLaterales" id="barraSup">
        <div class="datos-contacto-superior">
            <div>
                <img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/correo-electronico-icon-svg-png-download-11866287.png?f=webp&w=128" alt="correo">
                <h6>mina.imn@csic.es</h6>
            </div>
            <div>
                <img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="telefono">
                <h6>+34 91 806 07 00</h6>
            </div>
        </div>

        <div id="perfilContainer">
            <span id="nombreUsuarioBarra"></span>
            <img id="iconoUsuario" src="" alt="iconoUsuario">
            <div id="menuDesplegable" class="oculto">
                <button class="opcionMenu" id="irServicios">Gestión Peticiones</button>
                <button class="opcionMenu" id="cerrarSesion">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <div id="icon">
        <img src="/SGO/static/imagenes/Csic.png" alt="Csic Logo Izquierda" class="icono-centrado icono-izquierda">
        <img src="/SGO/static/imagenes/MicroNano.png" alt="Csic Logo Derecha" class="icono-centrado icono-derecha">
    </div>
    
    <div id="contenedorPrincipal">
        <h2 class="titulo-seccion">Configuración de Perfil Técnico</h2>
        
        <div id="formularioEdicion">
            <div class="seccion-foto">
                <img id="previewFoto" src="" alt="Vista previa">
                <input type="file" id="inputFileFoto" accept="image/*" style="display: none;">
                <div class="botones-foto">
                    <button type="button" id="btnCambiarFoto" class="btn-secundario">Cambiar Foto</button>
                    <button type="button" id="btnQuitarFoto" class="btn-peligro">Quitar Foto</button>
                </div>
            </div>

            <div class="grid-campos" style="grid-template-columns: 1fr;">
                <div class="input-group">
                    <label>Apodo de Técnico:</label>
                    <input type="text" id="editApodo" placeholder="Tu nombre público">
                </div>
            </div>

            <button id="btnGuardarCambios">Guardar Cambios</button>
        </div>
    </div>

    <div id="icon2">
        <img src="/SGO/static/imagenes/Mina.png" alt="Mina">
    </div>

    <div class="barrasLaterales" id="datos">
        <img src="/SGO/static/imagenes/CsicGris.png" alt="Logo Footer" class="logo-footer">
        <div class="redes-sociales">
            <a href="https://es-es.facebook.com/CSIC/" class="btn-social"><img src="https://cdn.pixabay.com/photo/2021/06/15/12/51/facebook-6338508_640.png" alt="Facebook"></a>
            <a href="https://www.instagram.com/csic/" class="btn-social" id="insta"><img src="https://static.vecteezy.com/system/resources/thumbnails/018/930/691/small/instagram-logo-instagram-icon-transparent-free-png.png" alt="Instagram"></a>
            <a href="https://x.com/csic" class="btn-social" id="twitter"><img src="https://1000logos.net/wp-content/uploads/2017/06/Twitter-Log%D0%BE-500x281.png" alt="Twitter/X"></a>
            <a href="https://www.youtube.com/user/csicdptocomunicacion" class="btn-social" id="youtube"><img src="https://static.vecteezy.com/system/resources/thumbnails/042/148/649/small/youtube-logo-youtube-social-media-icon-free-png.png" alt="Youtube"></a>
            <a href="https://www.tiktok.com/@elcsic" class="btn-social" id="tiktok"><img src="https://static.vecteezy.com/system/resources/thumbnails/065/386/723/small/tiktok-white-icon-logo-tiktok-app-transparent-background-premium-social-media-design-for-digital-download-free-png.png" alt="LinkedIn"></a>
            <a href="https://bsky.app/profile/csic.es" class="btn-social" id="bsky"><img src="https://images.seeklogo.com/logo-png/52/2/bluesky-logo-png_seeklogo-520643.png" alt="Bsky"></a>
        </div>
    </div>

    <script src="/SGO/static/js/ServicioEditT.js" defer></script>
</body>
</html>
