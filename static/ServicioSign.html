<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignServicio</title>
    <link rel="stylesheet" href="/static/Servicio.css">
    <link rel="stylesheet" href="/static/ServicioSign.css">
</head>
<body>
   <div class="barrasLaterales"></div>
    <div id = "icon"><img src = "/static/imagenes/Csic.png"></div>
    <div id = "imgCentral"><h1>Gestión de Peticiones</h1></div>
    <div id="sign">
    <form id = "registroForm">
        <h2>Sign up</h2>
        <div class="campo">
            <label for="nombre">Name:</label>
            <input type="text" id="nombre" placeholder="Name" required>
        </div>

        <div class="campo">
            <label for="apellidos">Last Name:</label>
            <input type="text" id="apellidos" placeholder="Last Name" required>
        </div>

        <div class="campo">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="campo">
    <label for="contraseña">Password:</label>
    <div class="password-container">
        <input type="password" id="contraseña" placeholder="Password" required>
    </div>
    <span id="mensajePassword"></span>
</div>
        <div class="campo">
            <label for="entidad">you're in?</label>
            <select id="entidad" name="entidad" required>
                <option selected disabled>select</option>
                <option value="mina">Interno</option>
                <option value="csic">CSIC</option>
                <option value="uam">UAM</option>
                <option value="universidad">Universidad</option>
                <option value="opis">OPIS</option>
                <option value="empresa">Empresa</option>
            </select>
        </div>

        <div id="camposExtra" style="display: none;">

    <div class="campo">
        <label for="grupo">Group:</label>
        <select id="group" name="group" required>
                <option selected disabled>select</option>
                <option value="mina">FINDER</option>
                <option value="csic">BIONANOMECÁNICA</option>
                <option value="uam">ES4TERM</option>
                <option value="universidad">OMS</option>
                <option value="opis">MBE</option>
                <option value="empresa">METALNANO</option>
            </select>
    </div>    

    <div class="campo">
        <label for="ip">IP:</label>
        <input type="text" id="ip" name="ip" placeholder="IP">
    </div>

    <div class="campo">
        <label for="cuenta">Internal Account:</label>
        <input type="text" id="cuenta" name="cuenta" placeholder="Internal Account">
    </div>

    <div class="campo">
        <label for="proyecto">Proyect Code:</label>
        <input type="text" id="proyecto" name="proyecto" placeholder="Proyect Code">
    </div>
</div>

        <button type="submit">Sign up</button>
        <a href="/static/ServicioLogin.html">Login up</a>
    </form>
</div>
<div id = "icon2"><img src = "/static/imagenes/Mina.png"></div>
<div class="barrasLaterales"></div>
</body>
<script src="/static/ServicioSign.js" defer></script>
</html>
