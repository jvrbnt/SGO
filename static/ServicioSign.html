<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignServicio - IMN</title>
    <link rel="stylesheet" href="Servicio.css">
    <link rel="stylesheet" href="ServicioLogin.css">
</head>
<body>
    <div class="barrasLaterales"></div>
    <div id="icon"><img src="imagenes/Csic.png"></div>
    <div id="imgCentral"><h1>Gestión de Peticiones</h1></div>
    
    <div id="sign">
        <form id="registroForm">
            <h2>Sign up</h2>
            
            <div class="campo">
                <label for="nombre">Name:</label>
                <input type="text" id="nombre" placeholder="Name" required>
            </div>

            <div class="campo">
                <label for="apellidos">Last Name:</label>
                <input type="text" id="apellidos" placeholder="Last Name" required>
            </div>

            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="campo">
                <label for="contraseña">Password:</label>
                <div class="password-container">
                    <input type="password" id="contraseña" placeholder="Password" required>
                </div>
                <span id="mensajePassword"></span>
            </div>

            <div class="campo">
                <label for="entidad">you're in?</label>
                <select id="entidad" name="entidad" required>
                    <option selected disabled>select</option>
                    <option value="mina">Interno (MiNa)</option>
                    <option value="csic">CSIC</option>
                    <option value="uam">UAM</option>
                    <option value="universidad">Universidad</option>
                    <option value="opis">OPIS</option>
                    <option value="empresa">Empresa</option>
                </select>
            </div>

            <div id="camposExtra" style="display: none;">
                <div class="fila-extra">
                    <div class="campo">
                        <label for="group">Group:</label>
                        <select id="group" name="group">
                            <option selected disabled>select</option>
                            <option value="finder">FINDER</option>
                            <option value="bionano">BIONANOMECÁNICA</option>
                            <option value="es4term">ES4TERM</option>
                            <option value="oms">OMS</option>
                            <option value="mbe">MBE</option>
                            <option value="metalnano">METALNANO</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="ip">IP:</label>
                        <input type="text" id="ip" name="ip" placeholder="IP">
                    </div>
                </div>

                <div class="fila-extra">
                    <div class="campo">
                        <label for="cuenta">Internal Account:</label>
                        <input type="text" id="cuenta" name="cuenta" placeholder="Account">
                    </div>
                    <div class="campo">
                        <label for="proyecto">Proyect Code:</label>
                        <input type="text" id="proyecto" name="proyecto" placeholder="Project">
                    </div>
                </div>
            </div>

            <button type="submit">Sign up</button>
            <a href="ServicioLogin.html">Login up</a>
        </form>
    </div>

    <div id="icon2"><img src="imagenes/Mina.png"></div>
<div class="barrasLaterales" id="datos"><div><img src="https://symbl-cdn.com/i/webp/bf/f742f23d736ec34c4cbe8d7e825e10.webp" alt="correo"><h6>Gmail: mina.imn@csic.es</h6></div><div><img src="https://static.vecteezy.com/system/resources/thumbnails/068/203/105/small/simple-blue-gradient-telephone-receiver-icon-isolated-on-transparent-background-png.png" alt="telefono"><h6>Teléfono: +34 91 806 07 00</h6></div></div>

    <script src="ServicioSign.js" defer></script>
</body>
</html>
